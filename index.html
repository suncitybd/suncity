}

  const [lang, setLang] = useState(lsGet('sc_lang', 'EN'));
  const [dark, setDark] = useState(lsGet('sc_dark', false));
  const [tab, setTab] = useState('home');
  const [sel, setSel] = useState(null);
  const [cart, setCart] = useState(lsGet('sc_cart', {}));
  const [cats, setCats] = useState([]); const [prods, setProds] = useState([]); const [banners, setBanners] = useState([]); const [settings, setSettings] = useState({});
  const [loading, setLoading] = useState(true); const [loadErr, setLoadErr] = useState('');
  const [user, setUser] = useState(null); const [cust, setCust] = useState(null);
  const [q, setQ] = useState(''); const [catF, setCatF] = useState('All');
  const [toast, setToast] = useState('');
  const [bi, setBi] = useState(0);
  const [lightboxOpen, setLightboxOpen] = useState(false);
  const [galleryIndex, setGalleryIndex] = useState(0);
  const [zoomScale, setZoomScale] = useState(1);
  const [bell, setBell] = useState(false); const [msgs, setMsgs] = useState([]); const bellRef = useRef(false);
  const touchStartRef = useRef(null);
  const pinchStartRef = useRef(0);
  const t = (en, bn) => (lang === 'BN' ? bn : en);
  const say = (m) => { setToast(m); setTimeout(() => setToast(''), 2200); };

  useEffect(() => { document.documentElement.dataset.theme = dark ? 'dark' : 'light'; lsSet('sc_dark', dark); }, [dark]);
  useEffect(() => { lsSet('sc_lang', lang); document.documentElement.lang = lang === 'BN' ? 'bn' : 'en'; }, [lang]);
  useEffect(() => { lsSet('sc_cart', cart); }, [cart]);

  async function loadShop() {
    try {
      const [c, p, b, s] = await Promise.all([
        sb.from('categories').select('*').order('sort'),
        sb.from('products').select('*').eq('active', true).order('sort_no'),
        sb.from('banners').select('*').eq('active', true).order('sort'),
        sb.from('settings').select('*'),
      ]);
      if (c.error || p.error) throw new Error((c.error || p.error).message);
      setCats(c.data || []); setProds(p.data || []); setBanners((b.data || [])); 
      const m = {}; (s.data || []).forEach((r) => { m[r.key] = r.value; }); setSettings(m);
      setLoadErr('');
    } catch (e) { setLoadErr(e.message || 'Could not load'); }
    setLoading(false);
  }
  useEffect(() => { loadShop(); }, []);

  async function loadCust(u) {
    if (!u) { setCust(null); return; }
    const { data } = await sb.from('customers').select('*').eq('user_id', u.id).maybeSingle();
    setCust(data || null);
  }
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { const u = data.session ? data.session.user : null; setUser(u); loadCust(u); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, session) => { const u = session ? session.user : null; setUser(u); setTimeout(() => loadCust(u), 0); });
    return () => sub.subscription.unsubscribe();
  }, []);

  bellRef.current = bell;
  async function loadMsgs(u) {
    if (!u) { setMsgs([]); return; }
    const { data } = await sb.rpc('my_messages', { p_limit: 50 });
    setMsgs(data || []);
  }
  useEffect(() => {
    loadMsgs(user);
    if (!user) return;
    const id = setInterval(() => { if (!document.hidden && !bellRef.current) loadMsgs(user); }, 45000);
    return () => clearInterval(id);
  }, [user && user.id]);
  const unread = msgs.filter((m) => m.unread).length;
  const openBell = async () => {
    if (!user) { go('account'); say(t('Sign in to see your messages', 'বার্তা দেখতে সাইন ইন করুন')); return; }
    await loadMsgs(user); setBell(true); sb.rpc('mark_messages_seen');
  };
  const closeBell = () => { setBell(false); setMsgs((m) => m.map((x) => ({ ...x, unread: false }))); };
  useEffect(() => { if (banners.length < 2) return; const id = setInterval(() => setBi((i) => (i + 1) % banners.length), 4500); return () => clearInterval(id); }, [banners.length]);

  const byId = useMemo(() => { const m = {}; prods.forEach((p) => { m[p.id] = p; }); return m; }, [prods]);
  const lines = Object.keys(cart).filter((id) => byId[id]).map((id) => ({ ...byId[id], qty: Math.min(cart[id], Math.max(byId[id].stock, 0)) })).filter((l) => l.qty > 0);
  const count = lines.reduce((a, l) => a + l.qty, 0);
  const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
  const dc = Number(settings.delivery_charge) || 0, free = Number(settings.free_delivery_over) || 0;
  const fee = dc > 0 && !(free > 0 && sub >= free) ? dc : 0;
  const add = (p) => { const cur = cart[p.id] || 0; if (cur >= p.stock) return say(t('Cannot add more of this item', 'এর বেশি যোগ করা যাচ্ছে না')); setCart({ ...cart, [p.id]: cur + 1 }); say(t('Added to cart', 'কার্টে যোগ হয়েছে')); };
  const dec = (id) => { const n = (cart[id] || 0) - 1; const c = { ...cart }; if (n <= 0) delete c[id]; else c[id] = n; setCart(c); };
  const pname = (p) => (lang === 'BN' && p.name_bn) || p.name;
  // Normalize supported product photo fields into one ordered URL list.
  const productImages = (p) => [...new Set([
    ...(Array.isArray(p.images) ? p.images : []),
    ...(Array.isArray(p.image_urls) ? p.image_urls : []),
    ...(Array.isArray(p.gallery_images) ? p.gallery_images : []),
    p.image_url
  ].map((x) => typeof x === 'string' ? x : x && (x.url || x.image_url || x.src))
    .filter((x) => typeof x === 'string' && x.trim()))];

  const hashDone = useRef(false);

    } catch (e) {}
  }, [sel]);
  const filtered = prods.filter((p) => (catF === 'All' || p.category === catF) && (pname(p) + p.name).toLowerCase().includes(q.toLowerCase()));
  const go = (k) => { setSel(null); setTab(k); window.scrollTo(0, 0); };

  const Card = (p, compact = false) => html`<article class=${"card" + (compact ? " compact" : "")} key=${p.id}>

  const CatBubble = (c) => html`<button class="cat" key=${c.id} onClick=${() => { setCatF(c.name); go('categories'); }}>
    <div class="c" style=${{ background: c.bg || '#fff' }}><${Img} src=${c.icon_url} fallback=${CAT_ICON[c.name] || '🛍️'} /></div>${c.name}</button>`;

  let body;
  const P = sel ? byId[sel] : null;
  if (P) {
    const inCart = cart[P.id] || 0;
    const sims = prods.filter((x) => x.category === P.category && x.id !== P.id).slice(0, 8);
    const desc = (lang === 'BN' && P.description_bn) || P.description;
    const gallery = productImages(P);
    const currentImage = gallery[galleryIndex] || gallery[0] || P.image_url;
    const openLightbox = (i) => { setGalleryIndex(i); setZoomScale(1); setLightboxOpen(true); };
    const changeGallery = (step) => { setGalleryIndex((i) => (i + step + gallery.length) % gallery.length); setZoomScale(1); };
    const onGalleryTouchStart = (e) => { if (e.touches.length === 2) { const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; pinchStartRef.current=Math.hypot(dx,dy); } else if (e.touches.length === 1) touchStartRef.current=e.touches[0].clientX; };
    const onGalleryTouchMove = (e) => { if (e.touches.length === 2 && pinchStartRef.current) { const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY; const d=Math.hypot(dx,dy); setZoomScale(Math.max(1,Math.min(4,zoomScale*d/pinchStartRef.current))); pinchStartRef.current=d; } };
    const onGalleryTouchEnd = (e) => { if (zoomScale <= 1.02 && touchStartRef.current != null && e.changedTouches[0]) { const dx=e.changedTouches[0].clientX-touchStartRef.current; if (Math.abs(dx)>55 && gallery.length>1) changeGallery(dx<0?1:-1); } touchStartRef.current=null; pinchStartRef.current=0; };
    const shareP = async () => { const url = location.origin + location.pathname + '#p=' + encodeURIComponent(P.id); try { if (navigator.share) { await navigator.share({ title: pname(P), url }); } else { await navigator.clipboard.writeText(url); say(t('Link copied', 'লিংক কপি হয়েছে')); } } catch (e) {} };
    body = html`<div><div class="row between"><button class="back" onClick=${() => setSel(null)}>‹ ${t('Back', 'ফিরে যান')}</button><span class="st s-way">${P.category}</span></div>
      <div class="pd-top"><div class="pd-img"><button class="big" style="width:100%;padding:0;border:0;cursor:zoom-in" onClick=${() => openLightbox(galleryIndex)}><${Img} src=${currentImage} fallback=${CAT_ICON[P.category] || '🧴'} /></button>
      ${gallery.length > 1 ? html`<div class="gallery-thumbs">${gallery.map((src,i) => html`<button class=${'gallery-thumb'+(i===galleryIndex?' active':'')} aria-label=${'Image '+(i+1)} onClick=${() => setGalleryIndex(i)}><img src=${src} loading="lazy" alt="" /></button>`)}</div>` : null}
      ${lightboxOpen ? html`<div class="lightbox" onTouchStart=${onGalleryTouchStart} onTouchMove=${onGalleryTouchMove} onTouchEnd=${onGalleryTouchEnd}>
        <button class="lightbox-close" aria-label="Close" onClick=${() => {setLightboxOpen(false);setZoomScale(1)}}>×</button>
        <div class="lightbox-count">${galleryIndex+1} / ${gallery.length}</div>
        ${gallery.length>1 ? html`<button class="lightbox-arrow prev" onClick=${() => changeGallery(-1)}>‹</button><button class="lightbox-arrow next" onClick=${() => changeGallery(1)}>›</button>` : null}
        <img src=${currentImage} alt=${pname(P)} style=${{transform:'scale('+zoomScale+')'}} onDoubleClick=${() => setZoomScale(zoomScale>1?1:2)} />
      </div>` : null}
      </div><div class="pd-info"><h1 style="font-size:22px;margin:14px 0 4px">${pname(P)}</h1>
      <div style="font-size:28px;font-weight:800">৳${P.price} ${P.old_price > P.price ? html`<s class="muted" style="font-size:15px;font-weight:400">৳${P.old_price}</s>` : null}</div>
      ${P.stock <= 0 ? html`<p class="muted">${t('Out of stock', 'স্টক শেষ')}</p>` : null}
      <button class="btn" disabled=${P.stock <= 0} onClick=${() => add(P)}>${t('Add to cart', 'কার্টে যোগ করুন')} • ৳${P.price}${inCart ? ' (' + inCart + ')' : ''}</button>
      <button class="btn alt" style="margin-top:8px" onClick=${shareP}>${t('Share this product', 'শেয়ার করুন')}</button></div></div>
      ${sims.length ? html`<h3 class="sec">${t('Similar products', 'একই ধরনের পণ্য')}</h3><div class="sims">${sims.map((x) => { const d = Math.round(Math.abs(x.price - P.price) / P.price * 100); const cheaper = x.price < P.price; return html`<button class="sim" key=${x.id} onClick=${() => { setSel(x.id); setGalleryIndex(0); setLightboxOpen(false); window.scrollTo(0, 0); }}>
        <span class="th"><${Img} src=${x.image_url} fallback=${CAT_ICON[x.category] || '🧴'} /></span>
        <span class="nm"><b>${pname(x)}</b>${x.stock <= 0 ? html`<span class="low">${t('Out of stock', 'স্টক শেষ')}</span>` : null}</span>
        <span class="pc"><b>৳${x.price}</b>${x.old_price > x.price ? html`<s>৳${x.old_price}</s>` : null}${d > 0 ? html`<span class=${cheaper ? 'tg g' : 'tg r'}>${cheaper ? t('Save ' + d + '%', d + '% সাশ্রয়') : t(d + '% Costlier', d + '% বেশি দাম')}</span>` : null}</span></button>`; })}</div>` : null}
      ${desc ? html`<h3 class="sec">${t('Description', 'বিবরণ')}</h3><div class="box" style="white-space:pre-wrap;font-size:14px;line-height:1.55">${desc}</div>` : null}</div>`;
  } else if (tab === 'home') {
    const b = banners[bi % Math.max(banners.length, 1)];
    body = html`<div>
      ${b ? html`<div>${b.image_url
        ? html`<button class="bannerimg" aria-label=${(lang === 'BN' && b.title_bn) || b.title || 'Banner'} onClick=${() => { if (b.button_text || b.button_bn) { setCatF('All'); go('categories'); } }}><${Img} src=${b.image_url} fallback=${null} /></button>`
        : html`<div class="banner" style=${{ background: b.gradient || 'linear-gradient(135deg,#ff7a1a,#d63a1f)' }}>
          <h2>${(lang === 'BN' && b.title_bn) || b.title}</h2>${(b.subtitle || b.subtitle_bn) ? html`<p>${(lang === 'BN' && b.subtitle_bn) || b.subtitle}</p>` : null}
          ${(b.button_text || b.button_bn) ? html`<button class="bt" onClick=${() => { setCatF('All'); go('categories'); }}>${(lang === 'BN' && b.button_bn) || b.button_text}</button>` : null}</div>`}
        ${banners.length > 1 ? html`<div class="dots">${banners.map((_, i) => html`<i key=${i} class=${i === bi % banners.length ? 'on' : ''}></i>`)}</div>` : null}</div>` : null}
      <h3 class="sec">${t('Categories', 'ক্যাটাগরি')}</h3>
      <div class="cats">${cats.map(CatBubble)}</div>
      ${q ? html`<h3 class="sec">${t('Results', 'ফলাফল')} • ${filtered.length}</h3><div class="grid">${filtered.map((p) => Card(p))}</div>` : cats.map((c) => { const items = prods.filter((p) => p.category === c.name); return items.length ? html`<section key=${c.id}><h3 class="sec">${(lang === 'BN' && c.name_bn) || c.name}<button onClick=${() => { setCatF(c.name); go('categories'); }}>${t('See All', 'সব দেখুন')} ›</button></h3><div class="product-row">${items.map((p) => Card(p, true))}</div></section>` : null })}
      ${!loading && prods.length === 0 && !loadErr ? html`<p class="muted" style="text-align:center">${t('No products yet.', 'এখনও কোনো পণ্য নেই।')}</p>` : null}</div>`;
  } else if (tab === 'categories') {
    body = html`<div><h1 style="font-size:22px;margin:0 0 10px">${t('Categories', 'ক্যাটাগরি')}</h1>
      <div class="chips">${['All', ...cats.map((c) => c.name)].map((n) => html`<button key=${n} class=${'chip' + (catF === n ? ' on' : '')} onClick=${() => setCatF(n)}>${n === 'All' ? t('All', 'সব') : n}</button>`)}</div>
      <h3 class="sec">${catF === 'All' ? t('All', 'সব') : catF} • ${filtered.length}</h3>
      <div class="grid">${filtered.map(Card)}</div>
      ${filtered.length === 0 ? html`<p class="muted" style="text-align:center">${t('No products here yet.', 'এখানে এখনও পণ্য নেই।')}</p>` : null}</div>`;
  } else if (tab === 'cart') {
    body = html`<div class="narrow"><${CartView} t=${t} lines=${lines} sub=${sub} fee=${fee} add=${add} dec=${dec} pname=${pname} cust=${cust} user=${user} go=${go} clear=${() => setCart({})} reload=${loadShop} /></div>`;
  } else {
    body = html`<div class="narrow"><${AccountView} t=${t} lang=${lang} setLang=${setLang} user=${user} cust=${cust} reloadCust=${() => loadCust(user)} settings=${settings} say=${say} pname=${pname} /></div>`;
  }

  const tabs = [['home', '⌂', t('Home', 'হোম')], ['categories', '▦', t('Categories', 'ক্যাটাগরি')], ['cart', '🛒', t('Cart', 'কার্ট')], ['account', '👤', t('Account', 'অ্যাকাউন্ট')]];
  const wa = normPhone(settings.whatsapp || '01577172585');
  return html`<div class="app">
    <header><div class="hwrap"><span class="logo">sun<b>city</b></span>
      <label class="search">🔍<input value=${q} onInput=${(e) => { setQ(e.target.value); if (tab !== 'home') setTab('home'); setSel(null); }} placeholder=${t('Search products', 'পণ্য খুঁজুন')} /></label>
      <div class="topnav">${tabs.map(([k, ic, l]) => html`<button key=${k} class=${!sel && tab === k ? 'on' : ''} onClick=${() => go(k)}>${l}${k === 'cart' && count > 0 ? html`<span class="badge">${count}</span>` : null}</button>`)}</div>
      <div class="row hact"><button class="pill bell" onClick=${openBell} aria-label=${t('Messages', 'বার্তা')}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>${unread > 0 ? html`<span class="bbadge">${unread > 9 ? '9+' : unread}</span>` : null}</button>
        <button class="pill" onClick=${() => setDark(!dark)} aria-label="theme">${dark ? '☀' : '☾'}</button></div></div></header>
    <main>${loading ? html`<p class="muted" style="text-align:center;margin-top:40px">${t('Loading…', 'লোড হচ্ছে…')}</p>` : loadErr ? html`<div class="err">${loadErr} <button onClick=${loadShop} style="text-decoration:underline">${t('Retry', 'আবার চেষ্টা')}</button></div>` : body}</main>
    <a class="wa" href=${'https://wa.me/88' + wa} target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
    <nav><div>${tabs.map(([k, ic, l]) => html`<button key=${k} class=${!sel && tab === k ? 'on' : ''} onClick=${() => go(k)}><span class="i">${ic}</span>${l}${k === 'cart' && count > 0 ? html`<span class="badge">${count}</span>` : null}</button>`)}</div></nav>
    ${bell ? html`<div class="notif" onClick=${closeBell}><div class="npanel" onClick=${(e) => e.stopPropagation()}><div class="row between"><b style="font-size:17px">${t('Messages', 'বার্তা')}</b><button class="back" onClick=${closeBell}>${t('Close', 'বন্ধ')}</button></div>
      ${msgs.length === 0 ? html`<p class="muted" style="text-align:center">${t('No messages yet.', 'এখনও কোনো বার্তা নেই।')}</p>` : msgs.map((m) => html`<div class=${'nmsg' + (m.unread ? ' new' : '')} key=${m.id}>${m.title ? html`<b>${m.title}</b>` : null}<div style="white-space:pre-wrap">${m.body}</div><div class="muted">${fmtDate(m.created_at)}</div></div>`)}</div></div>` : null}
    ${toast ? html`<div class="toast">${toast}</div>` : null}</div>`;
}

function CartView({ t, lines, sub, fee, add, dec, pname, cust, user, go, clear, reload }) {
  const [step, setStep] = useState('cart');
  const [name, setName] = useState(''); const [phone, setPhone] = useState(''); const [addr, setAddr] = useState('');
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [done, setDone] = useState(null);
  useEffect(() => { if (cust) { setName((v) => v || cust.name || ''); setPhone((v) => v || cust.phone || ''); setAddr((v) => v || cust.address || ''); } }, [cust]);
  async function place() {
    setErr(''); setBusy(true);
    const { data, error } = await sb.rpc('place_order', { p_name: name, p_phone: phone, p_address: addr, p_items: lines.map((l) => ({ id: l.id, qty: l.qty })) });
    setBusy(false);
    if (error) return setErr(error.message);
    setDone(data); clear(); reload();
  }
  if (done) return html`<div class="box" style="text-align:center"><div style="font-size:48px">🎉</div><h2>${t('Order placed!', 'অর্ডার হয়েছে!')}</h2>
    <p>${t('Your order number', 'আপনার অর্ডার নম্বর')}: <b>#${done}</b></p><p class="muted">${t('We will confirm it soon. Pay cash when it arrives.', 'শীঘ্রই কনফার্ম করব। পণ্য হাতে পেয়ে টাকা দিন।')}</p>
    <button class="btn" onClick=${() => go(user ? 'account' : 'home')}>${user ? t('See my orders', 'আমার অর্ডার দেখুন') : t('Continue shopping', 'কেনাকাটা চালিয়ে যান')}</button></div>`;
  if (lines.length === 0) return html`<div class="box" style="text-align:center"><div style="font-size:48px">🛒</div><h2>${t('Your cart is empty', 'কার্ট খালি')}</h2><button class="btn" onClick=${() => go('home')}>${t('Browse products', 'পণ্য দেখুন')}</button></div>`;
  return html`<div><h1 style="font-size:22px;margin:0 0 10px">${t('My Cart', 'আমার কার্ট')}</h1>
    ${lines.map((l) => html`<div class="box row" key=${l.id}><div style="flex:1;min-width:0"><div class="pn" style="min-height:0">${pname(l)}</div><b>৳${l.price * l.qty}</b></div>
      <span class="qty"><button onClick=${() => dec(l.id)}>−</button>${l.qty}<button onClick=${() => add(l)}>+</button></span></div>`)}
    <div class="box"><div class="line"><span>${t('Subtotal', 'সাবটোটাল')}</span><b>৳${sub}</b></div><div class="line"><span>${t('Delivery', 'ডেলিভারি')}</span><b>${fee ? '৳' + fee : t('Free', 'ফ্রি')}</b></div>
      <div class="line tot"><span>${t('Total', 'মোট')}</span><span>৳${sub + fee}</span></div></div>
    ${step === 'cart' ? html`<button class="btn" onClick=${() => setStep('form')}>${t('Checkout', 'চেকআউট')}</button>` : html`<div class="box"><b>${t('Delivery details', 'ডেলিভারির তথ্য')}</b>
      <input class="in" placeholder=${t('Full name', 'পুরো নাম')} value=${name} onInput=${(e) => setName(e.target.value)} />
      <input class="in" placeholder="01XXXXXXXXX" inputMode="tel" value=${phone} onInput=${(e) => setPhone(e.target.value)} />
      <textarea class="in" rows="3" placeholder=${t('Full address', 'পূর্ণ ঠিকানা')} value=${addr} onInput=${(e) => setAddr(e.target.value)}></textarea>
      ${!user ? html`<div class="ok" style="background:var(--soft);color:var(--ink)">${t('Not signed in: this order will NOT show in My Orders. Sign in first to track every step.', 'সাইন ইন করা নেই: এই অর্ডার My Orders-এ দেখা যাবে না। প্রতিটি ধাপ দেখতে আগে সাইন ইন করুন।')}<button class="chip" style="margin-top:8px;display:block" onClick=${() => go('account')}>${t('Sign in / Create account', 'সাইন ইন / অ্যাকাউন্ট খুলুন')}</button></div>` : null}
      ${err ? html`<div class="err">${err}</div>` : null}
      <button class="btn" style="margin-top:10px" disabled=${busy} onClick=${place}>${busy ? '…' : t('Place order • Cash on delivery', 'অর্ডার করুন • ক্যাশ অন ডেলিভারি')}</button></div>`}</div>`;
}

function AccountView({ t, lang, setLang, user, cust, reloadCust, settings, say, pname }) {
  const [mode, setMode] = useState('signup');
  const [f, setF] = useState({ name: '', phone: '', pw: '', ref: '' });
  const [busy, setBusy] = useState(false); const [err, setErr] = useState('');
  const [orders, setOrders] = useState(null); const [chip, setChip] = useState('all'); const [open, setOpen] = useState({});
  const [refd, setRefd] = useState(null); const [refErr, setRefErr] = useState(''); const [ordErr, setOrdErr] = useState('');
  const [edit, setEdit] = useState(false); const [pf, setPf] = useState({ name: '', address: '' });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  function loadRef() {
    setRefErr('');
    sb.rpc('my_referral').then(({ data, error }) => {
      if (error) { setRefErr(error.message); return; }
      if (!data) { setRefErr(t('Referral code is not ready yet. Please try again.', 'রেফার কোড এখনো তৈরি হয়নি। আবার চেষ্টা করুন।')); return; }
      setRefd(data);
    });
  }
  useEffect(() => {
    if (!user) { setOrders(null); setRefd(null); setRefErr(''); return; }
    sb.from('orders').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(50).then(({ data, error }) => { if (error) setOrdErr(error.message); setOrders(data || []); });
    loadRef();
  }, [user && user.id]);
  useEffect(() => { if (cust) setPf({ name: cust.name || '', address: cust.address || '' }); }, [cust]);

  async function submit() {
    setErr(''); setBusy(true);
    const phone = normPhone(f.phone);
    if (mode === 'signup') {
      const { data, error } = await sb.functions.invoke('customer-auth', { body: { action: 'signup', phone, password: f.pw, name: f.name, ref: f.ref } });
      if (error) { let m = error.message; try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (e) {} setBusy(false); return setErr(m); }
      if (data && data.error) { setBusy(false); return setErr(data.error); }
    }
    const { error: e2 } = await sb.auth.signInWithPassword({ email: phone + '@' + DOMAIN, password: f.pw });
    setBusy(false);
    if (e2) setErr(t('Wrong phone number or password', 'ফোন নম্বর বা পাসওয়ার্ড ভুল'));
  }
  async function saveProfile() {
    const { error } = await sb.from('customers').update({ name: pf.name.trim(), address: pf.address.trim() }).eq('user_id', user.id);
    if (error) return say(error.message);
    setEdit(false); reloadCust(); say(t('Saved', 'সংরক্ষিত'));
  }
  const copy = (txt) => { try { navigator.clipboard.writeText(String(txt)); say(t('Copied', 'কপি হয়েছে')); } catch (e) { say(String(txt)); } };
  const wa = normPhone(settings.whatsapp || '01577172585');
  const refOn = !['0', 'false', 'off', ''].includes(String(settings.ref_enabled || '').toLowerCase());

  if (!user) return html`<div><div class="box"><div class="seg"><button class=${mode === 'login' ? 'on' : ''} onClick=${() => setMode('login')}>${t('Sign in', 'সাইন ইন')}</button><button class=${mode === 'signup' ? 'on' : ''} onClick=${() => setMode('signup')}>${t('Create account', 'নতুন অ্যাকাউন্ট')}</button></div>
    ${mode === 'signup' ? html`<input class="in" placeholder=${t('Your name', 'আপনার নাম')} value=${f.name} onInput=${set('name')} />` : null}
    <input class="in" placeholder="01XXXXXXXXX" inputMode="tel" value=${f.phone} onInput=${set('phone')} />
    <input class="in" type="password" placeholder=${t('Password (6+ characters)', 'পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)')} value=${f.pw} onInput=${set('pw')} />
    ${mode === 'signup' ? html`<input class="in" placeholder=${t('Referral code (optional)', 'রেফারেল কোড (ঐচ্ছিক)')} value=${f.ref} onInput=${set('ref')} />` : null}
    ${err ? html`<div class="err">${err}</div>` : null}
    <button class="btn" style="margin-top:12px" disabled=${busy} onClick=${submit}>${busy ? '…' : mode === 'login' ? t('Sign in', 'সাইন ইন') : t('Create account', 'অ্যাকাউন্ট খুলুন')}</button></div>
    <${Settings} t=${t} lang=${lang} setLang=${setLang} wa=${wa} /></div>`;

  const list = (orders || []).filter((o) => chip === 'all' || groupOf(o.status) === chip);
  return html`<div>
    <div class="box" style="background:var(--navy);color:#fff"><div class="row between"><div><b style="font-size:17px">${cust ? cust.name : t('Customer', 'গ্রাহক')}</b><div style="font-size:12px;opacity:.7">${cust ? cust.phone : ''}</div></div>
      <button class="pill" onClick=${() => setEdit(!edit)}>${t('Edit', 'সম্পাদনা')}</button></div>
      ${edit ? html`<div><input class="in" value=${pf.name} onInput=${(e) => setPf({ ...pf, name: e.target.value })} /><textarea class="in" rows="2" placeholder=${t('Address', 'ঠিকানা')} value=${pf.address} onInput=${(e) => setPf({ ...pf, address: e.target.value })}></textarea><button class="btn" style="margin-top:8px" onClick=${saveProfile}>${t('Save', 'সংরক্ষণ')}</button></div>` : null}</div>
    ${refOn ? html`<h3 class="sec" style="margin-top:6px">${t('Refer & Earn', 'রেফার করে আয় করুন')}</h3><div class="box">
      ${refd ? html`<div class="row between"><span>${t('Your code', 'আপনার কোড')}</span><span class="row"><b style="background:var(--soft);color:var(--orange);padding:4px 10px;border-radius:8px;font-size:16px">${refd.code}</b><button onClick=${() => copy(refd.code)} aria-label="copy">⧉</button></span></div>
        <div class="line"><span>${t('Friends joined', 'যোগ দিয়েছে')}</span><b>${refd.joined}</b></div><div class="line"><span>${t('Qualified', 'যোগ্য হয়েছে')}</span><b>${refd.qualified}</b></div><div class="line"><span>${t('Wallet', 'ওয়ালেট')}</span><b>৳${refd.balance}</b></div>
        <p class="muted">${t('You earn when a friend you referred gets their first order delivered (the order must be placed while signed in).', 'আপনার রেফার করা বন্ধু সাইন ইন অবস্থায় প্রথম অর্ডার দিলে এবং তা ডেলিভারি হলে আপনি বোনাস পাবেন।')}</p>
        ${settings.ref_terms ? html`<p class="muted" style="white-space:pre-wrap">${settings.ref_terms}</p>` : null}`
      : refErr ? html`<div class="err">${refErr} <button onClick=${loadRef} style="text-decoration:underline">${t('Retry', 'আবার চেষ্টা')}</button></div>`
      : html`<p class="muted">…</p>`}</div>` : null}
    <h3 class="sec">${t('My orders', 'আমার অর্ডার')}</h3>
    <div class="chips" style="margin-bottom:10px">${[['all', t('All', 'সব')], ['active', t('Active', 'চলমান')], ['done', t('Delivered', 'ডেলিভারি হয়েছে')], ['can', t('Cancelled', 'বাতিল')]].map(([k, l]) => html`<button key=${k} class=${'chip' + (chip === k ? ' on' : '')} onClick=${() => setChip(k)}>${l}</button>`)}</div>
    ${ordErr ? html`<div class="err">${ordErr}</div>` : null}${orders === null ? html`<p class="muted">…</p>` : list.length === 0 ? html`<p class="muted" style="text-align:center">${t('No orders here.', 'কোনো অর্ডার নেই।')}</p>` : list.map((o) => { const [cls, lab] = statusInfo(o.status, t); return html`<div class="box" key=${o.id}>
      <div class="row between"><div class="row"><b>#${o.order_no}</b><button onClick=${() => copy(o.order_no)} aria-label="copy">⧉</button></div><span class=${'st ' + cls}>${lab}</span></div>
      <div class="muted" style="margin-top:6px">${t('Placed', 'অর্ডার')}: ${fmtDate(o.created_at)}</div>
      ${o.delivered_at ? html`<div class="muted">${t('Delivered', 'ডেলিভারি')}: ${fmtDate(o.delivered_at)}</div>` : null}
      <div class="muted">${t('Payment', 'পেমেন্ট')}: ${t('Cash on delivery', 'ক্যাশ অন ডেলিভারি')}</div>
      <div class="muted">${t('Address', 'ঠিকানা')}: ${o.address}</div>
      <div class="line tot"><span>${t('Total', 'মোট')}</span><span>৳${o.total}</span></div>
      <${Timeline} o=${o} t=${t} />
      <button class="chip" style="margin-top:8px" onClick=${() => setOpen({ ...open, [o.id]: !open[o.id] })}>${open[o.id] ? t('Hide details', 'বিস্তারিত লুকান') : t('View details', 'বিস্তারিত দেখুন')}</button>
      ${open[o.id] ? html`<div style="margin-top:8px">${(o.items || []).map((it, i) => html`<div class="it" key=${i}><b>${i + 1}.</b><span style="flex:1">${it.name} × ${it.qty}</span><span>৳${it.price * it.qty}</span></div>`)}
        ${Number(o.delivery_fee) > 0 ? html`<div class="it"><b></b><span style="flex:1">${t('Delivery', 'ডেলিভারি')}</span><span>৳${o.delivery_fee}</span></div>` : null}</div>` : null}</div>`; })}
    <${Settings} t=${t} lang=${lang} setLang=${setLang} wa=${wa} />
    <button class="btn alt" style="color:var(--red)" onClick=${async () => { await sb.auth.signOut(); setOrders(null); }}>${t('Logout', 'লগআউট')}</button></div>`;
}

function InstallBox({ t }) {
  const [, tick] = useState(0);
  useEffect(() => { const f = () => tick((n) => n + 1); window.addEventListener('bip', f); return () => window.removeEventListener('bip', f); }, []);
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone || window.Capacitor;
  if (standalone) return null;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const install = async () => { const e = window.__bip; if (!e) return; e.prompt(); try { await e.userChoice; } catch (x) {} window.__bip = null; tick((n) => n + 1); };
  return html`<div class="box"><div class="installbox"><b>📲 ${t('Install the Suncity app', 'সানসিটি অ্যাপ ইনস্টল করুন')}</b>${window.__bip ? html`<button class="chip on" onClick=${install}>${t('Install', 'ইনস্টল')}</button>` : null}</div>
    ${window.__bip ? null : html`<p class="muted" style="margin:8px 0 0">${ios ? t('Tap the Share button, then "Add to Home Screen".', 'শেয়ার বাটনে চাপুন, তারপর "Add to Home Screen" বেছে নিন।') : t('Open the browser menu and choose "Install app" or "Add to Home screen".', 'ব্রাউজারের মেনু খুলে "Install app" বা "Add to Home screen" বেছে নিন।')}</p>`}</div>`;
}

function Settings({ t, lang, setLang, wa }) {
  return html`<div><${InstallBox} t=${t} /><h3 class="sec">${t('Contact us', 'যোগাযোগ')}</h3><div class="box"><a class="line" style="text-decoration:none;color:inherit" href=${'tel:' + wa}><span>📞 ${t('Call to order', 'কল করে অর্ডার')}</span><b>${wa}</b></a>
    <a class="line" style="text-decoration:none;color:inherit" href=${'https://wa.me/88' + wa} target="_blank" rel="noopener"><span>💬 WhatsApp</span><b>${t('Chat', 'চ্যাট')}</b></a></div>
    <div class="box row between"><span>🌐 ${t('Language', 'ভাষা')}</span><div class="seg"><button class=${lang === 'EN' ? 'on' : ''} onClick=${() => setLang('EN')}>English</button><button class=${lang === 'BN' ? 'on' : ''} onClick=${() => setLang('BN')}>বাংলা</button></div></div></div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>

<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sun City | Admin Panel - Supabase</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#172033}header{background:#123d2b;color:white;padding:20px}header h2{margin:0 0 6px}header p{margin:0;color:#d5eadc}main{max-width:950px;margin:22px auto;padding:0 14px}.card{background:white;padding:18px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0000000b}h3{margin-top:0}input,button{font:inherit;padding:12px;border-radius:7px}input{width:100%;border:1px solid #d5dbe5;margin:5px 0 12px}button{border:0;cursor:pointer;background:#176b45;color:white}button:hover{opacity:.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:white;padding:16px;border-radius:10px}.stat strong{display:block;font-size:24px;margin-top:8px}.item{border-bottom:1px solid #eee;padding:14px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.del{background:#c62828}.notice{font-size:13px;padding:12px;border-radius:8px}.ok{background:#e6f4ea;border:1px solid #a3d9a5}.warn{background:#fff8e7;border:1px solid #f5d28b}</style></head><body>
<header><h2>☀ Sun City</h2><p>Admin Panel — Supabase Connected <span id="sbStatus" style="background:#ffffff33;padding:3px 8px;border-radius:999px;font-size:12px">Connecting...</span></p></header>
<main>
<div class="stats"><div class="stat">মোট পণ্য<strong id="total">0</strong></div><div class="stat">মোট স্টক<strong id="stock">0</strong></div><div class="stat">পণ্যের ধরন<strong id="types">0</strong></div></div>
<section class="card"><div class="notice ok" id="mainNotice">✅ Supabase: roncolxqicnreydvregs - Admin controls Customer - SUNCITY-ADMIN-V1-CONTROL-1023-2026 - Key sb_publishable_0QE7...</div><h3>＋ নতুন পণ্য</h3><form id="productForm"><div class="grid"><div><label>নাম</label><input id="name" required placeholder="চাল"></div><div><label>ক্যাটাগরি</label><input id="category" required placeholder="মুদি"></div><div><label>দাম</label><input id="price" type="number" required placeholder="100"></div><div><label>স্টক</label><input id="quantity" type="number" required placeholder="20"></div><div class="full"><label>ছবির লিংক</label><input id="image" type="url" placeholder="https://..."></div></div><button type="submit">যোগ করুন</button></form></section>

<section class="card"><p><a href="https://suncitybd.github.io/suncity/" target="_blank"><button>কাস্টমার সাইট</button></a> <a href="https://supabase.com/dashboard/project/roncolxqicnreydvregs/editor" target="_blank"><button style="background:#222">Supabase</button></a></p></section>
</main>
<script>
const SUPABASE_URL='https://roncolxqicnreydvregs.supabase.co';
const SUPABASE_KEY='sb_publishable_0QE7GLcOVFmgajkdTp3wFg_xoT9sktA';
const SB_HEADERS={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const KEY="suncity_admin_demo_products_v1";
const form=document.getElementById("productForm");
const list=document.getElementById("products");
const search=document.getElementById("search");
function loadProducts(){try{const d=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(d)?d.filter(p=>p&&typeof p.id==="string"&&typeof p.name==="string"&&typeof p.category==="string"&&Number.isFinite(p.price)&&Number.isFinite(p.quantity)):[]}catch{return[]}}
let products=loadProducts();
function saveProducts(){try{localStorage.setItem(KEY,JSON.stringify(products));return true}catch{return false}}
function render(){document.getElementById("total").textContent=products.length;document.getElementById("stock").textContent=products.reduce((s,p)=>s+p.quantity,0);document.getElementById("types").textContent=new Set(products.map(p=>p.category)).size;list.replaceChildren();let q=search.value.trim().toLowerCase();let shown=products.filter(p=>(p.name+" "+p.category).toLowerCase().includes(q));if(!shown.length){let e=document.createElement("p");e.textContent=products.length?"মিল নেই":"এখনো পণ্য নেই";list.appendChild(e);return}shown.forEach(p=>{let row=document.createElement("div");row.className="item";let info=document.createElement("div");let t=document.createElement("strong");t.textContent=p.name;let d=document.createElement("small");d.textContent=p.category+" · ৳"+p.price+" · "+p.quantity;info.append(t,d);let del=document.createElement("button");del.className="del";del.textContent="মুছুন";del.addEventListener("click",async()=>{if(!confirm("মুছবেন?"))return;products=products.filter(i=>i.id!==p.id);saveProducts();render();try{await fetch(SUPABASE_URL+'/rest/v1/products?id=eq.'+encodeURIComponent(p.id),{method:'DELETE',headers:SB_HEADERS});await fetch(SUPABASE_URL+'/rest/v1/products?name=eq.'+encodeURIComponent(p.name),{method:'DELETE',headers:SB_HEADERS})}catch(e){}});row.append(info,del);list.appendChild(row)})}
async function loadFromSupabase(){try{document.getElementById("sbStatus").textContent="Connecting...";let res=await fetch(SUPABASE_URL+'/rest/v1/products?select=*&order=created_at.desc',{headers:SB_HEADERS});if(!res.ok)throw new Error(res.status);let data=await res.json();document.getElementById("sbStatus").textContent='Live ('+data.length+')';if(data.length>0){products=data.map(d=>({id:String(d.id),name:d.name,category:d.category||'অন্যান্য',price:Number(d.price||0),quantity:Number(d.stock||d.quantity||0),image:d.image||''}));saveProducts();render()}}catch(e){document.getElementById("sbStatus").textContent='Offline';console.error(e)}}
form.addEventListener("submit",async e=>{e.preventDefault();let name=document.getElementById("name").value.trim();let category=document.getElementById("category").value.trim();let price=Number(document.getElementById("price").value);let quantity=Number(document.getElementById("quantity").value);let image=document.getElementById("image").value.trim();if(!name||!category||!price||quantity<0){alert("সঠিক তথ্য দিন");return}if(image){try{let u=new URL(image);if(u.protocol!=="https:"&&u.protocol!=="http:")throw Error()}catch{alert("সঠিক লিংক দিন");return}}let product={id:crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random(),name,category,price,quantity,image};products.unshift(product);if(!saveProducts()){products=products.filter(p=>p.id!==product.id);return}form.reset();render();try{let res=await fetch(SUPABASE_URL+'/rest/v1/products',{method:'POST',headers:SB_HEADERS,body:JSON.stringify([{name,category,price,stock:quantity,image,emoji:'📦',brand:''}])});if(res.ok)document.getElementById("mainNotice").textContent='✅ Supabase-এ সেভ হয়েছে!'}catch(err){document.getElementById("mainNotice").textContent='⚠️ Local saved, Supabase failed: '+err.message}});search.addEventListener("input",render);render();loadFromSupabase();
</script></body></html>

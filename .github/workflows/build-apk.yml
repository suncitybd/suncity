name: Build Suncity APK

# Run it by hand: GitHub, Actions, Build Suncity APK, Run workflow.
# The APK is a thin shell that opens the live Suncity site, so website updates reach the app without a new APK.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Live Suncity link (must end with /)"
        required: true
        default: "https://suncitybd.github.io/suncity/"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ github.event.inputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        run: | mkdir -p apkbuild/www apkbuild/assets cd apkbuild npm init -y npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 echo '<!doctype html><meta charset="utf-8"><title>Suncity</title><body style="background:#0F2340;color:#fff;font-family:sans-serif;text-align:center;padding-top:40vh">Loading Suncity...</body>' > www/index.html cat > capacitor.config.json <<JSON { "appId": "com.suncity.shop", "appName": "Suncity", "webDir": "www", "server": { "url": "${SITE_URL}", "androidScheme": "https" } } JSON cp ../icon-1024.png assets/icon-only.png cp ../splash.png assets/splash.png npx cap add android npx capacitor-assets generate --android --iconBackgroundColor '#0F2340' --splashBackgroundColor '#0F2340' npx cap sync android 
      - name: Build the APK
        working-directory: apkbuild/android
        run: | chmod +x gradlew ./gradlew assembleDebug 
      - name: Name the file
        run: cp apkbuild/android/app/build/outputs/apk/debug/app-debug.apk Suncity.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Suncity-APK
          path: Suncity.apk

      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Suncity APK ${{ github.run_number }}
          files: Suncity.apk
